<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>VS Code Explorer - GiuaKy</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background: #1e1e1e;
      color: #cccccc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe WPC", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-size: 13px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 30px;
    }
    .explorer-window {
      width: 320px;
      background: #252526;
      border: 1px solid #333333;
      border-radius: 8px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      overflow: hidden;
    }
    .explorer-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 16px;
      background: #252526;
      border-bottom: 1px solid #1e1e1e;
    }
    .explorer-title {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: #bbbbbb;
    }
    .explorer-actions {
      color: #858585;
      font-size: 15px;
      cursor: pointer;
      letter-spacing: 2px;
    }
    .tree-container {
      padding: 8px 0;
      background: #1e1e1e;
    }
    .tree-node {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 4px 12px;
      cursor: pointer;
      user-select: none;
      transition: background 0.1s;
    }
    .tree-node:hover {
      background: #2a2d2e;
    }
    .tree-node.active {
      background: #37373d;
      color: #ffffff;
    }
    .node-content {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .arrow-icon {
      font-size: 10px;
      color: #cccccc;
      width: 14px;
      text-align: center;
      display: inline-block;
    }
    .folder-name {
      font-weight: 600;
      font-size: 13px;
      color: #e2e8f0;
    }
    .sub-node {
      padding-left: 28px;
    }
    .sub-folder-name {
      font-weight: 400;
      font-size: 13px;
      color: #cccccc;
    }
    .node-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      opacity: 0.8;
    }
    .action-icon {
      width: 16px;
      height: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #c5c5c5;
    }
    .action-icon svg {
      width: 14px;
      height: 14px;
      fill: currentColor;
    }
    .folder-icon {
      width: 16px;
      height: 16px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: #dcb67a;
    }
    .folder-icon svg {
      width: 16px;
      height: 16px;
      fill: currentColor;
    }
  </style>
</head>
<body>

  <div class="explorer-window">
    <!-- Explorer Title Bar -->
    <div class="explorer-header">
      <span class="explorer-title">Explorer</span>
      <span class="explorer-actions">•••</span>
    </div>

    <!-- Tree Structure -->
    <div class="tree-container">
      <!-- Root Node: GiuaKy -->
      <div class="tree-node active">
        <div class="node-content">
          <span class="arrow-icon">⌵</span>
          <span class="folder-name">GiuaKy</span>
        </div>
        <div class="node-actions">
          <!-- New File -->
          <span class="action-icon" title="New File">
            <svg viewBox="0 0 16 16"><path d="M9 1H3a1 1 0 0 0-1 1v12a1 1 0 0 0 1 1h10a1 1 0 0 0 1-1V6L9 1zm4 13H3V2h5v4h5v8zm-5-3h2v-2h-2v2zm0-3h2V6h-2v2z"/></svg>
          </span>
          <!-- New Folder -->
          <span class="action-icon" title="New Folder">
            <svg viewBox="0 0 16 16"><path d="M7 2l2 2h5a1 1 0 0 1 1 1v8a1 1 0 0 1-1 1H2a1 1 0 0 1-1-1V3a1 1 0 0 1 1-1h5zm7 10V5H8.59L6.59 3H2v9h12z"/></svg>
          </span>
          <!-- Refresh -->
          <span class="action-icon" title="Refresh">
            <svg viewBox="0 0 16 16"><path d="M13.65 2.35A7.95 7.95 0 0 0 8 0a8 8 0 1 0 8 8h-2a6 6 0 1 1-1.76-4.24l-2.24 2.24H16V0l-2.35 2.35z"/></svg>
          </span>
          <!-- Collapse All -->
          <span class="action-icon" title="Collapse Folders in Explorer">
            <svg viewBox="0 0 16 16"><path d="M1 8h14v1H1zm3-4h8v1H4zm3 8h2v1H7z"/></svg>
          </span>
        </div>
      </div>

      <!-- Child Node: backend -->
      <div class="tree-node sub-node">
        <div class="node-content">
          <span class="arrow-icon">›</span>
          <span class="folder-icon">
            <svg viewBox="0 0 16 16"><path d="M1.5 2A1.5 1.5 0 0 0 0 3.5v9A1.5 1.5 0 0 0 1.5 14h13a1.5 1.5 0 0 0 1.5-1.5v-7A1.5 1.5 0 0 0 14.5 4H7.414L5.707 2.293A1 1 0 0 0 5 2H1.5z"/></svg>
          </span>
          <span class="sub-folder-name">backend</span>
        </div>
      </div>

      <!-- Child Node: frontend -->
      <div class="tree-node sub-node">
        <div class="node-content">
          <span class="arrow-icon">›</span>
          <span class="folder-icon">
            <svg viewBox="0 0 16 16"><path d="M1.5 2A1.5 1.5 0 0 0 0 3.5v9A1.5 1.5 0 0 0 1.5 14h13a1.5 1.5 0 0 0 1.5-1.5v-7A1.5 1.5 0 0 0 14.5 4H7.414L5.707 2.293A1 1 0 0 0 5 2H1.5z"/></svg>
          </span>
          <span class="sub-folder-name">frontend</span>
        </div>
      </div>
    </div>
  </div>

</body>
</html>
