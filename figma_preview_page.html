<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Figma - TOEIC Reading v02</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: #090d16;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .figma-header {
      background: #181d29;
      color: #f5f5f5;
      padding: 12px 28px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13.5px;
      border-bottom: 1px solid #232a3b;
    }
    .figma-logo-wrap {
      display: flex;
      align-items: center;
      gap: 14px;
    }
    .figma-icon {
      width: 22px;
      height: 22px;
      background: #0d99ff;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 12px;
      color: white;
    }
    .figma-title {
      font-weight: 700;
      color: #ffffff;
    }
    .figma-sub {
      color: #8b9bb4;
      font-size: 12.5px;
    }
    .figma-actions {
      display: flex;
      align-items: center;
      gap: 14px;
    }
    .user-pill {
      background: #232a3b;
      padding: 5px 14px;
      border-radius: 20px;
      font-size: 12px;
      color: #cbd5e1;
      font-weight: 600;
    }
    .btn-share {
      background: #0d99ff;
      color: white;
      border: none;
      padding: 7px 16px;
      border-radius: 8px;
      font-weight: 700;
      font-size: 12.5px;
      cursor: pointer;
    }
    .canvas-container {
      padding: 24px;
      background: #090d16;
      display: flex;
      justify-content: center;
    }
    img.design-img {
      max-width: 100%;
      height: auto;
      border-radius: 12px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.6);
    }
  </style>
</head>
<body>
  <div class="figma-header">
    <div class="figma-logo-wrap">
      <div class="figma-icon">F</div>
      <span class="figma-title">TOEIC Reading v02 - Design System & UI Screens (5 Artboards)</span>
      <span class="figma-sub">/ Drafts / Untitled (PKERJyir1UHvo9FdFQX2X5)</span>
    </div>
    <div class="figma-actions">
      <span class="user-pill">Owner: taitestgame (taichinhpro123@gmail.com)</span>
      <span class="user-pill">Zoom: 100%</span>
      <button class="btn-share">Share</button>
    </div>
  </div>
  <div class="canvas-container">
    <img class="design-img" src="file:///C:/code/python/hoc/bailam/figma_toeic_design.svg" />
  </div>
</body>
</html>
